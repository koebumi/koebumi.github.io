<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* X や Slack でリンクを貼ったときのプレビュー画像（1200×630）。サイトのファーストビューと同じ見出しにする */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(520px 360px at 12% 18%, #cfe6ea, transparent 70%), radial-gradient(520px 360px at 92% 30%, #ffe1d5, transparent 70%), #f3f5f3; color: #10262b; font-family: "Zen Kaku Gothic New", sans-serif; position: relative; }
  .label { position: absolute; left: 84px; top: 70px; font-family: "IBM Plex Mono", monospace; font-size: 20px; letter-spacing: 0.08em; color: #5b6c70; display: flex; align-items: center; gap: 12px; }
  .label i { width: 11px; height: 11px; border-radius: 50%; background: #fe6f47; display: block; }
  h1 { position: absolute; left: 80px; top: 104px; margin: 0; font-size: 92px; font-weight: 500; line-height: 1.14; letter-spacing: -0.02em; }
  h1 span { color: #7d8b8e; }
  .chips { position: absolute; left: 84px; right: 84px; top: 352px; display: flex; gap: 14px; }
  .chip { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 16px; border-radius: 16px; background: #fff; box-shadow: 0 10px 30px rgba(15, 35, 40, 0.08); font-size: 20px; font-weight: 700; color: #4a5c60; white-space: nowrap; }
  .chip b { color: #fe6f47; font-weight: 500; }
  .chip code { font-family: "IBM Plex Mono", monospace; font-size: 19px; font-weight: 500; color: #1b4851; background: #dcecef; border-radius: 8px; padding: 3px 10px; }
  .foot { position: absolute; left: 84px; right: 84px; bottom: 64px; display: flex; align-items: center; gap: 22px; }
  .foot img { width: 84px; height: 84px; border-radius: 20px; }
  .name { font-size: 40px; font-weight: 900; line-height: 1.1; }
  .tag { font-size: 22px; color: #44585c; font-weight: 700; }
  .meta { margin-left: auto; text-align: right; font-family: "IBM Plex Mono", monospace; font-size: 18px; color: #5b6c70; line-height: 1.7; }
</style></head>
<body>
  <div class="label"><i></i>CLAUDE CODE ・ CODEX</div>
  <h1>Claude Codeに、<br><span>声で指示する。</span></h1>
  <div class="chips">
    <div class="chip">「はい」<b>→</b><code>1. Yes</code></div>
    <div class="chip">「スラッシュ コンパクト」<b>→</b><code>/compact</code></div>
    <div class="chip">「〜して、送信」<b>→</b><code>↵ Enter</code></div>
  </div>
  <div class="foot"><img src="../assets/icon-512.png" alt=""><div><div class="name">Koebumi</div><div class="tag">メールやチャットの文章も、同じFnキーで。</div></div>
    <div class="meta">無料・オープンソース<br>macOS 26+ ・ Apple silicon</div></div>
</body></html>
