<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Koebumi PR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;800&display=swap">
<!--
  Koebumi の PR 動画（15 秒、1920×1080、黒地にミニマル）。renderAt(t) は時刻 t（秒）だけで画面を決める。
  場面の切り替えは拍（BEAT 秒ごと）に合わせる。曲に合わせるときは BEAT と OFFSET（最初の拍の時刻）だけを変える。
  画面に出す文章は、Koebumi（Apple オンデバイス）で実際に整形した結果（句読点は初期設定の「、。」）。
-->
<style>
  :root {
    --white: #f5f5f7;
    --gray: #86868b;
    --gray2: #48484c;
    --orange: #fe6f47;
    --teal: #5fb3c1;
    --sans: "SF Pro Display", -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    --mono: "SF Mono", Menlo, "Hiragino Sans", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: var(--sans); color: var(--white); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 0 0; }
  #glow { position: absolute; inset: 0; }

  .center { position: absolute; left: 0; right: 0; text-align: center; }
  .big { font-size: 190px; font-weight: 800; letter-spacing: -0.01em; line-height: 1; }
  .mid { font-size: 96px; font-weight: 800; letter-spacing: -0.005em; line-height: 1.1; }
  .small { font-size: 40px; font-weight: 600; color: var(--gray); }

  /* 3D の舞台 */
  #space { position: absolute; inset: 0; perspective: 2300px; perspective-origin: 50% 40%; }
  .win { position: absolute; left: 50%; top: 50%; border-radius: 26px; background: #111113; overflow: hidden;
         box-shadow: 0 60px 160px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.10); will-change: transform; }
  .chrome { height: 56px; display: flex; align-items: center; padding: 0 22px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); position: relative; }
  .lights { display: flex; gap: 10px; }
  .lights i { width: 15px; height: 15px; border-radius: 50%; display: block; background: #3a3a3e; }
  .title { position: absolute; left: 0; right: 0; text-align: center; font-size: 20px; color: var(--gray); }

  #chat { width: 1240px; height: 640px; margin: -320px 0 0 -620px; }
  #chat .msg { position: absolute; left: 56px; right: 56px; display: flex; gap: 20px; }
  .avatar { width: 60px; height: 60px; border-radius: 30px; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 26px; }
  .who { font-size: 22px; font-weight: 700; color: var(--gray); }
  .said { font-size: 36px; margin-top: 8px; }
  .input { position: absolute; left: 56px; right: 56px; bottom: 50px; height: 92px; border-radius: 46px; background: #1c1c1f; display: flex; align-items: center; padding: 0 40px; font-size: 36px; }
  .ph { color: #5a5a5f; }
  .caret { display: inline-block; width: 3px; height: 40px; background: var(--orange); margin-left: 4px; vertical-align: middle; }

  #term { width: 1240px; height: 640px; margin: -320px 0 0 -620px; background: #0b0b0c; }
  #term .screen { padding: 36px 50px; font-family: var(--mono); font-size: 30px; line-height: 1.6; position: relative; height: 584px; }
  .tl { white-space: pre; }
  .tdim { color: #5a5a5f; }
  .rule { border-top: 2px solid #2c2c30; margin: 8px 0; }
  .sel { color: var(--white); }
  .opt { color: #6e6e73; }
  .hit { color: var(--orange); }

  /* 話した言葉のチップ */
  .chip { position: absolute; left: 50%; display: flex; align-items: center; gap: 16px; padding: 18px 34px; border-radius: 999px;
          background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12); font-size: 38px; color: #c7c7cc; white-space: nowrap;
          backdrop-filter: blur(20px); }
  .chip svg { flex: none; }
  .strike { text-decoration: line-through; text-decoration-color: var(--orange); text-decoration-thickness: 4px; color: #6e6e73; }

  /* 音声バー（アプリと同じ形と色） */
  #voicebar { position: absolute; left: 50%; width: 300px; height: 102px; margin-left: -150px; border-radius: 51px;
              background: linear-gradient(#45445a, #3a394d); border: 2px solid rgba(255, 255, 255, 0.22); box-shadow: 0 18px 60px rgba(0, 0, 0, 0.8); }
  #voicebar img { position: absolute; left: 15px; top: 15px; width: 68px; height: 68px; }
  #bars { position: absolute; left: 112px; top: 0; height: 98px; display: flex; align-items: center; gap: 9px; }
  #bars i { display: block; width: 6px; border-radius: 3px; background: #f4f4f6; }

  /* 最後 */
  #logo { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #logo img { width: 210px; height: 210px; border-radius: 48px; }
  #logo .name { margin-top: 40px; font-size: 128px; font-weight: 800; letter-spacing: -0.01em; line-height: 1; }
  #logo .tag { margin-top: 30px; font-size: 46px; font-weight: 600; color: var(--gray); }
  #logo .url { margin-top: 52px; font-size: 32px; font-weight: 600; color: var(--white); letter-spacing: 0.01em; }
  .u { text-decoration: underline; text-decoration-color: var(--orange); text-decoration-thickness: 4px; text-underline-offset: 10px; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>

  <!-- 0. 話す。整う。入る。 -->
  <div class="center big" id="w1" style="top: 445px">話す。</div>
  <div class="center big" id="w2" style="top: 445px">整う。</div>
  <div class="center big" id="w3" style="top: 445px">入る。</div>
  <div class="center mid" id="wRow" style="top: 492px">話す。<span style="color:var(--gray)">整う。</span>入る。</div>

  <div id="space">
    <!-- 1. チャット -->
    <div class="win" id="chat">
      <div class="chrome"><div class="lights"><i></i><i></i><i></i></div><div class="title"># プロジェクト</div></div>
      <div class="msg" style="top: 110px">
        <div class="avatar" style="background:#2c2c30;color:#c7c7cc">佐</div>
        <div><div class="who">佐藤</div><div class="said">明日の会議、何時からにしましょうか？</div></div>
      </div>
      <div class="msg" id="chatMine" style="top: 250px">
        <div class="avatar" style="background:var(--orange);color:#000">あ</div>
        <div><div class="who">あなた</div><div class="said">明日の会議は4時にしてください</div></div>
      </div>
      <div class="input" id="chatInput"></div>
    </div>

    <!-- 3. ターミナル（Claude Code） -->
    <div class="win" id="term">
      <div class="chrome"><div class="lights"><i></i><i></i><i></i></div><div class="title">claude — ~/workspace/app</div></div>
      <div class="screen" id="termScreen"></div>
    </div>
  </div>

  <div class="chip" id="chip"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#c7c7cc" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="chipText"></span></div>

  <div id="voicebar"><img src="assets/mic.png"><div id="bars"></div></div>

  <!-- キャプション -->
  <div class="center mid" id="cap1" style="top: 70px">言いよどみも、言い直しも。</div>
  <div class="center small" id="keigoLabel" style="top: 360px">メールは、敬語で。</div>
  <div class="center mid" id="keigoBefore" style="top: 470px; color: var(--gray)">ちょっと遅れて参加します</div>
  <div class="center mid" id="keigoAfter" style="top: 470px"><span class="u">少し</span>遅れて参加<span class="u">いたします</span>。</div>
  <div class="center mid" id="cap3" style="top: 70px">Claude Codeにも、声で。</div>

  <!-- 4. 特徴 -->
  <div class="center big" id="f1" style="top: 445px">APIキー不要。</div>
  <div class="center big" id="f2" style="top: 445px">オフラインでも。</div>
  <div class="center big" id="f3" style="top: 445px">無料。</div>
  <div class="center big" id="f4" style="top: 445px">オープンソース。</div>

  <div id="logo">
    <img src="assets/icon.png">
    <div class="name">Koebumi</div>
    <div class="tag">話すだけで、整った日本語に。</div>
    <div class="url">github.com/koebumi/koebumi</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const expoOut = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const easeIn = (p) => p * p * p;
const lerp = (a, b, p) => a + (b - a) * p;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// ---- 拍 ----
// 曲に合わせるときはこの 2 つだけを変える。b(n) は n 拍目の時刻（秒）
let BEAT = 0.5;
let OFFSET = 0;
const b = (n) => OFFSET + n * BEAT;
window.DURATION = 15;

function set(el, opacity, transform = "", blur = 0) {
  el.style.opacity = opacity.toFixed(3);
  el.style.visibility = opacity <= 0.002 ? "hidden" : "visible";
  el.style.transform = transform;
  el.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : "none";
}

// 拍で入って拍で出る文字。入りはぼかしから、出は少し上へ
function word(el, t, inAt, outAt, opts = {}) {
  const inDur = opts.inDur ?? BEAT * 0.55, outDur = opts.outDur ?? BEAT * 0.35;
  const pi = expoOut(prog(t, inAt, inAt + inDur));
  const po = easeIn(prog(t, outAt - outDur, outAt));
  const a = Math.min(pi, 1 - po);
  const scale = lerp(opts.from ?? 1.12, 1, pi) * lerp(1, 0.96, po);
  set(el, a, `translateY(${(-po * 24).toFixed(1)}px) scale(${scale.toFixed(4)})`, (1 - pi) * 22 + po * 14);
}

function renderGlow(t) {
  // 上からのごく弱い光。場面によって色を少し変える
  const teal = clamp(Math.min(prog(t, b(4), b(5)), 1 - prog(t, b(9.5), b(10)))) + clamp(Math.min(prog(t, b(14), b(15)), 1 - prog(t, b(21.5), b(22))));
  const warm = clamp(Math.min(prog(t, b(26), b(27)), 1));
  $("glow").style.background =
    `radial-gradient(1200px 700px at 50% -10%, rgba(255,255,255,${(0.07).toFixed(3)}), transparent 70%),` +
    `radial-gradient(1100px 500px at 50% 95%, rgba(95,179,193,${(0.10 * teal).toFixed(3)}), transparent 70%),` +
    `radial-gradient(900px 600px at 50% 50%, rgba(254,111,71,${(0.10 * warm).toFixed(3)}), transparent 70%)`;
}

function renderIntroWords(t) {
  word($("w1"), t, b(0), b(1));
  word($("w2"), t, b(1), b(2));
  word($("w3"), t, b(2), b(3));
  // 4 拍目で 3 つが横に並ぶ
  word($("wRow"), t, b(3), b(4), { from: 1.06 });
}

// 3D の窓の動き。入る・ゆっくり寄る・出る
function win3d(el, t, s, e, from, to) {
  const pi = expoOut(prog(t, s, s + BEAT * 1.2));
  const drift = prog(t, s, e);
  const po = easeIn(prog(t, e - BEAT * 0.6, e));
  const rx = lerp(from.rx, to.rx, pi) + drift * (to.drx ?? 0);
  const ry = lerp(from.ry, to.ry, pi) + drift * (to.dry ?? 0);
  const z = lerp(from.z, to.z, pi) + drift * (to.dz ?? 0) - po * 500;
  const y = lerp(from.y ?? 0, to.y ?? 0, pi);
  const a = Math.min(pi, 1 - po);
  set(el, a, `translate3d(0, ${y.toFixed(1)}px, ${z.toFixed(1)}px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`, po * 18);
}

function chip(t, s, e, parts, strikeAt, y) {
  const el = $("chip");
  const pi = expoOut(prog(t, s, s + BEAT * 0.5));
  const po = easeIn(prog(t, e - BEAT * 0.4, e));
  const a = Math.min(pi, 1 - po);
  if (a <= 0) return false;
  set(el, a, `translateX(-50%) translateY(${((1 - pi) * 20).toFixed(1)}px)`, (1 - pi) * 10);
  el.style.top = `${y}px`;
  const total = parts.reduce((n, p) => n + p[0].length, 0);
  let shown = Math.ceil(total * prog(t, s, s + BEAT * 1.6));
  const struck = t >= strikeAt;
  let html = "";
  for (const [text, drop] of parts) {
    const n = Math.min(text.length, shown);
    shown -= n;
    if (n > 0) html += drop && struck ? `<span class="strike">${esc(text.slice(0, n))}</span>` : esc(text.slice(0, n));
  }
  $("chipText").innerHTML = html;
  return true;
}

function voiceBar(t, s, e, y) {
  const pi = expoOut(prog(t, s, s + BEAT * 0.5));
  const po = easeIn(prog(t, e - BEAT * 0.4, e));
  const a = Math.min(pi, 1 - po);
  set($("voicebar"), a, `translateY(${((1 - pi) * 30).toFixed(1)}px) scale(${lerp(0.9, 1, pi).toFixed(3)})`);
  $("voicebar").style.top = `${y}px`;
  const bars = $("bars").children;
  for (let i = 0; i < bars.length; i++) {
    const c = i - (bars.length - 1) / 2;
    const env = Math.exp(-(c * c) / 18);
    const v = 0.5 + 0.5 * Math.sin(t * 13.1 + i * 1.7) * Math.sin(t * 5.3 + i * 0.9 + 1.3);
    bars[i].style.height = `${(10 + 52 * env * v).toFixed(1)}px`;
  }
  return a > 0;
}
(() => { for (let i = 0; i < 11; i++) $("bars").appendChild(document.createElement("i")); })();

function renderChat(t) {
  win3d($("chat"), t, b(4), b(10), { rx: 32, ry: 0, z: -900, y: 120 }, { rx: 16, ry: -14, z: -240, y: 40, dry: 6, dz: 140 });
  const pasteAt = b(7.5);
  $("chatInput").innerHTML = t < pasteAt ? `<span class="ph">メッセージ</span>`
    : t < b(8.5) ? `<span style="background:rgba(254,111,71,${(0.35 * (1 - prog(t, pasteAt, pasteAt + BEAT * 1.5))).toFixed(3)});border-radius:8px;padding:2px 6px;margin:0 -6px">明日の会議は4時にしてください</span><span class="caret"></span>`
    : `<span class="ph">メッセージ</span>`;
  const m = expoOut(prog(t, b(8.5), b(9)));
  set($("chatMine"), m, `translateY(${((1 - m) * 24).toFixed(1)}px)`);
  word($("cap1"), t, b(8), b(10), { from: 1.04 });
}

function renderKeigo(t) {
  word($("keigoLabel"), t, b(10), b(14), { from: 1.02 });
  word($("keigoBefore"), t, b(10.25), b(12.25), { from: 1.04, outDur: BEAT * 0.6 });
  word($("keigoAfter"), t, b(12), b(14), { from: 1.08 });
}

function renderTerm(t) {
  // 拍ごとに角度を変える（カットのように）
  const angle = t < b(16) ? -1 : t < b(18) ? 1 : -1;
  win3d($("term"), t, b(14), b(22), { rx: 30, ry: 20, z: -900, y: 120 }, { rx: 12, ry: 12 * angle, z: -260, y: 60, dz: 120 });
  word($("cap3"), t, b(14.5), b(22), { from: 1.04 });

  const hist = [`<div class="tl tdim">⏺ ビルドとテストが通りました。続けてデプロイします。</div>`];
  if (t >= b(16.5)) hist.push(`<div class="tl tdim">❯ /compact</div>`);
  if (t >= b(19.5)) hist.push(`<div class="tl tdim">❯ 先にビルドだけして</div>`);
  let box;
  if (t >= b(17) && t < b(19)) {
    const sel = t < b(18.5) ? 1 : 3;
    const o = (n, text) => sel === n ? `<div class="tl sel">❯ ${esc(text)}</div>` : `<div class="tl opt">  ${esc(text)}</div>`;
    box = `<div class="rule"></div><div class="tl"><b>Bash command</b></div><div class="tl">  npm run deploy</div><div class="tl" style="margin-top:6px">Do you want to proceed?</div>`
      + o(1, "1. Yes") + o(2, "2. Yes, and don't ask again") + o(3, "3. No");
  } else {
    let line = "";
    if (t >= b(16) && t < b(16.5)) line = `<span class="hit">/compact</span>`;
    else if (t >= b(19) && t < b(19.5)) line = `<span class="hit">先にビルドだけして</span>`;
    else if (t >= b(21)) line = `<span class="hit">AgentInput</span>のテストを直して。`;
    box = `<div class="rule"></div><div class="tl">❯ ${line}<span class="caret" style="height:32px"></span></div><div class="rule"></div>`;
  }
  $("termScreen").innerHTML = hist.join("") + box;
}

function renderChips(t) {
  let shown = false;
  // チャット
  if (!shown) shown = chip(t, b(4.75), b(8.25), [["えーと、", 1], ["明日の会議は", 0], ["3時に、いや", 1], ["4時にしてください", 0]], b(7), 948);
  // ターミナル
  if (!shown) shown = chip(t, b(15), b(16.25), [["スラッシュ コンパクト", 0]], 99, 948);
  if (!shown) shown = chip(t, b(17.25), b(18.75), [["いいえ、先にビルドだけして", 0]], 99, 948);
  if (!shown) shown = chip(t, b(19.75), b(21.25), [["えーと、", 1], ["エージェントインプットのテストを直して", 0]], b(20.75), 948);
  if (!shown) set($("chip"), 0);
  // 音声バーは、チャットで話している間だけ出す（ターミナルでは文字のチップだけにして、画面をすっきりさせる）
  if (!voiceBar(t, b(4.5), b(7.5), 820)) set($("voicebar"), 0);
}

function renderFeatures(t) {
  word($("f1"), t, b(22), b(23));
  word($("f2"), t, b(23), b(24));
  word($("f3"), t, b(24), b(25));
  word($("f4"), t, b(25), b(26));
}

function renderLogo(t) {
  const kids = $("logo").children;
  const starts = [b(26), b(26.5), b(27), b(27.75)];
  for (let i = 0; i < kids.length; i++) {
    const p = expoOut(prog(t, starts[i], starts[i] + BEAT * 0.9));
    set(kids[i], p, i === 0 ? `scale(${lerp(0.7, 1, p).toFixed(3)})` : `translateY(${((1 - p) * 20).toFixed(1)}px)`, (1 - p) * 16);
  }
  $("logo").style.visibility = t >= b(26) - 0.01 ? "visible" : "hidden";
}

window.renderAt = function (t) {
  renderGlow(t);
  renderIntroWords(t);
  renderChat(t);
  renderKeigo(t);
  renderTerm(t);
  renderChips(t);
  renderFeatures(t);
  renderLogo(t);
};
window.setBeat = (beat, offset) => { BEAT = beat; OFFSET = offset; };
const params = new URLSearchParams(location.search);
if (params.get("beat")) setBeat(parseFloat(params.get("beat")), parseFloat(params.get("offset") || "0"));
renderAt(params.get("t") ? parseFloat(params.get("t")) : 0);
</script>
<script src="player.js"></script>
</body>
</html>
